    <header>
      <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand" href="index.html" title="Logo branding, takes you to home page when clicked.">My Calendar 📅</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>

          <div class="collapse navbar-collapse" id="navbarText">
            <ul id="MainNav" class="navbar-nav me-auto mb-2 mb-lg-0">
              <li id="MyCalendarLink" class="nav-item"><a class="nav-link" href="calendar.html" Title="Opens your calendar. (Should only show when logged in)">Go to calendar</a></li>
              <li id="MessageBoardLink" class="nav-item"><a class="nav-link" href="messageboard.html" title="Opens the message board. (Should only show when logged in)">Message board</a></li>

<main>
  <h1>Login</h1>
  <h2 id="LoginMsg"></h2>
    <form id="loginForm">
        <div id="loginCtn" class="container">

            <fieldset>
                <legend>Login</legend>

                <div class="row">
                    <div class="col-12 col-md-4">
                        <label id="lblFirstName" for="txtFirstName">First Name:</label>
                        <input type="text" id="txtFirstName" class="form-control" value="" required="" placeholder="John" pattern="^[a-zA-Z]+$" title="Alphanumeric characters only, no numbers. Max 100 characters" />
                    </div>
                    <div class="col-12 col-md-4">
                        <label id="lblLastName" for="txtLastName">Last Name:</label>
                        <input type="text" id="txtLastName" class="form-control" value="" required="" placeholder="doe" pattern="^[a-zA-Z]+$" title="Alphanumeric characters only, no numbers. Max 100 characters" />
                    </div>

                    <div class="col-12 col-md-4">
                        <label id="lblPassword" for="txtPassword">Password:</label>
                        <input type="text" id="txtPassword" class="form-control" required="" placeholder="vanilla" />
                    </div>

                    <div class="col-12">
                        <input type="submit" value="login" class="btn btn-primary w-100 mt-2"/>
                    </div>
                </div>
            </fieldset>

        </div>
    </form>

    <div id="loginMsgFunny"></div>

</main>
